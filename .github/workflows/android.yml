name: Niche USB/IP Android Debug Build

on:
  push:
    branches:
      - niche-usbip-stability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Niche development branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          # The pipeline exit status must come from sdkmanager rather than 'yes'.
          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-37" "build-tools;35.0.0" "ndk;25.1.8937393" "cmake;3.22.1"
          set -o pipefail

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build development APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: niche-usbip-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
